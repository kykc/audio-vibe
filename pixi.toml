[workspace]
name = "audio-ipc2"
description = "System-wide audio processing utility -- client (valet) side"
channels = ["conda-forge"]
platforms = ["win-64"]

# MSVC is not redistributable; the vs*_win-64 packages only *activate* a local install, so
# Visual Studio 2022+ with the Desktop C++ workload stays a machine prerequisite (sec. 6.1).
# Which Visual Studio generation does the activating is a feature, not a fixed dependency.
[dependencies]
cmake = ">=3.28"
ninja = "*"
catch2 = "3.*"
qt6-main = "6.*"
# Pinned to a major on purpose: clang-format changes its own output between LLVM generations, so
# an open range would silently reformat the whole tree on an unrelated `pixi update`. It is not
# compiler-specific, so it lives here rather than in a vs* feature -- the shared solve group gives
# both environments the same binary.
clang-format = "22.*"

# One environment per Visual Studio generation: `pixi run <task>` builds with VS2022 and
# `pixi run -e vs2026 <task>` with VS2026. Match the environment to the machine. Each
# activation script probes for its own generation first (`vswhere -products * -version
# [major.0,major+1.0)`) and only that probe passes `-products *`, i.e. only that probe can see a
# *Build Tools* install; the fallback chain ends at a bare `vswhere -latest`, which cannot.
# So a mismatch on a Build Tools-only machine leaves VSINSTALLDIR empty and activation fails --
# that is why CI runs `-e vs2026` against its VS 18 Build Tools node.
# On a full (Community/Professional/Enterprise) install a mismatch does work: verified that
# vs2026_win-64 activates a local VS2022 Enterprise, deriving both the generator and
# -vcvars_ver from the installed toolset. It still exports the wrong CMAKE_GENERATOR_TOOLSET,
# which the `unset` below already removes for unrelated reasons.
[feature.vs2022.dependencies]
vs2022_win-64 = "*"

[feature.vs2026.dependencies]
vs2026_win-64 = "*"

# A shared solve group gives both environments bit-identical cmake/ninja/qt6-main/catch2, so
# switching environments changes the compiler and nothing else. Caveat: both configure the same
# `build/` tree, and since CXX is "cl.exe" in either environment CMake sees no change to complain
# about and reuses the compiler path it cached first -- on a machine that has both Visual Studios,
# delete `build/` when switching.
[environments]
default = { features = ["vs2022"], solve-group = "shared" }
vs2026 = { features = ["vs2026"], solve-group = "shared" }

# The activation script sets up MSVC for the *Visual Studio* generator: besides the compiler
# environment we want, it exports CMAKE_GENERATOR_PLATFORM=x64 and CMAKE_GENERATOR_TOOLSET
# (v143 or v145). Ninja Multi-Config (sec. 6.1) rejects a platform specification outright, and
# blanking the variables is not enough -- CMake treats "defined but empty" as specified -- so they
# have to be removed from the environment. That cannot be expressed in CMakePresets.json or in
# pixi's `env` tables, both of which can only *set* variables, hence the `unset` prefix on every
# task that runs CMake.
[tasks]
configure = "unset CMAKE_GENERATOR_PLATFORM CMAKE_GENERATOR_TOOLSET && cmake --preset default"
build = { cmd = "unset CMAKE_GENERATOR_PLATFORM CMAKE_GENERATOR_TOOLSET && cmake --build --preset dev", depends-on = ["configure"] }
test = { cmd = "unset CMAKE_GENERATOR_PLATFORM CMAKE_GENERATOR_TOOLSET && ctest --preset dev", depends-on = ["build"] }
probe = { cmd = "build/tools/valet_probe/RelWithDebInfo/valet_probe.exe", depends-on = ["build"] }
ui = { cmd = "build/ui/RelWithDebInfo/aip_ui.exe", depends-on = ["build"] }
# The portable folder: build/package, which runs on a machine with no pixi, no Qt and no Visual
# Studio. Copy it anywhere. See cmake/package.cmake for what goes in it and why.
package = { cmd = "unset CMAKE_GENERATOR_PLATFORM CMAKE_GENERATOR_TOOLSET && cmake --build --preset dev --target aip_package", depends-on = ["build"] }
# Hygiene (sec. 6.1). `.clang-format` already holds the style, including the 100-column limit that
# was hand-maintained until now. Both tasks take their file list from `git ls-files`, so the
# FetchContent dependencies under build/ are never touched and the extension list lives in one
# place. `apo/src/aip_apo.def` is excluded by that list on purpose -- clang-format has no grammar
# for a module-definition file and would mangle it.
format = "git ls-files '*.cpp' '*.h' | xargs clang-format -i"
# The verifying half, for CI: reports every misformatted line and exits non-zero instead of
# editing anything.
format-check = "git ls-files '*.cpp' '*.h' | xargs clang-format --dry-run --Werror"
